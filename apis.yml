name: Zeal
description: 'Zeal is a self-custodial onchain crypto wallet built for everyday life, pairing
  a non-custodial multi-chain wallet with real-world spending through a Gnosis Pay Visa
  debit card. Users hold USD and EUR stablecoins, earn yield via DeFi protocols such as
  Sky and Aave, and spend in 150+ countries with cashback, all while retaining full control
  of their own keys. Security features include Safety Checks, a Privacy Shield, biometric
  authentication, real-time transaction alerts and card freeze. Surfaced as a portfolio
  company of Northzone and added to the API Evangelist network for enrichment; as of this
  pass Zeal publishes a consumer product and help documentation but no public API, SDK,
  OpenAPI specification, or developer platform.'
